name: Sync Google Scholar Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:  
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-scholar-sync.txt

      - name: Sync publications from Google Scholar
        run: python scripts/sync_google_scholar.py --config scripts/scholar-sync.yaml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync Google Scholar publications"
          branch: chore/sync-google-scholar
          delete-branch: true
          title: "chore: sync Google Scholar publications"
          body: |
            Automated update generated by the Google Scholar sync workflow.
            Review and merge to publish updated publication entries.
